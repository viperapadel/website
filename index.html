    letter-spacing:.24em;text-transform:uppercase;color:var(--bone)}

    padding-block:2.4rem 2.8rem;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;

  footer a{color:rgba(237,233,224,.94);text-decoration:none;
    border-bottom:1px solid rgba(237,233,224,.34);padding-bottom:2px;transition:color .2s,border-color .2s}
  footer a:hover{color:var(--bone);border-color:var(--bone)}

  @media (prefers-reduced-motion:no-preference){
    main > *{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
